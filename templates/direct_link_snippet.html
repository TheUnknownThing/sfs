<div
  id="direct-link-output"
  class="rounded-xl border border-tertiary-container/20 bg-tertiary-container/10 p-4"
  role="region"
  aria-live="polite"
>
  <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
    <div class="flex items-center gap-3">
      <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-tertiary-container text-on-tertiary-container">
        <span class="material-symbols-outlined">link</span>
      </div>
      <div>
        <p class="font-label-lg text-label-lg text-on-surface">Link Generated Successfully</p>
        <p class="font-body-md text-body-md text-on-surface-variant">
          Expires in <strong>{{ ttl_minutes }} minute{% if ttl_minutes != 1 %}s{% endif %}</strong> ({{ expires_display }}).
        </p>
      </div>
    </div>
    <div class="flex min-w-0 items-center gap-2 rounded-lg border border-surface-variant bg-surface p-1 pl-4">
      <input
        id="{{ input_id }}"
        type="text"
        value="{{ link }}"
        readonly
        class="min-w-0 flex-1 border-none bg-transparent p-0 font-mono text-sm text-tertiary focus:ring-0"
      />
      <button
        type="button"
        class="relative flex h-10 w-10 shrink-0 items-center justify-center rounded-md text-on-surface-variant transition-colors hover:bg-surface-container-high data-[copy-state=copied]:after:absolute data-[copy-state=copied]:after:-top-10 data-[copy-state=copied]:after:left-1/2 data-[copy-state=copied]:after:-translate-x-1/2 data-[copy-state=copied]:after:whitespace-nowrap data-[copy-state=copied]:after:rounded-full data-[copy-state=copied]:after:bg-tertiary-container data-[copy-state=copied]:after:px-3 data-[copy-state=copied]:after:py-1 data-[copy-state=copied]:after:text-xs data-[copy-state=copied]:after:font-semibold data-[copy-state=copied]:after:text-on-tertiary-container data-[copy-state=copied]:after:content-['Copied!']"
        data-copy
        data-copy-target="#{{ input_id }}"
        aria-label="Copy direct link"
      >
        <span class="material-symbols-outlined">content_copy</span>
      </button>
    </div>
  </div>
</div>
