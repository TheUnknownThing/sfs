<!DOCTYPE html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      {% block title %}{{ layout.title }} - {{ layout.brand_name }}{% endblock %}
    </title>
    <meta name="color-scheme" content="light" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries,typography"></script>
    <script id="tailwind-config">

        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary-container": "#4a675f",
              "surface-dim": "#d8dada",
              surface: "#f8faf9",
              "primary-fixed-dim": "#aecdc3",
              tertiary: "#36503b",
              error: "#ba1a1a",
              "surface-bright": "#f8faf9",
              "surface-container-high": "#e6e9e8",
              "inverse-primary": "#aecdc3",
              "surface-tint": "#47645c",
              "surface-container-highest": "#e1e3e2",
              "on-primary": "#ffffff",
              outline: "#727976",
              "secondary-container": "#c5e4f5",
              "on-primary-container": "#c4e4da",
              "inverse-surface": "#2e3131",
              background: "#f8faf9",
              "tertiary-container": "#4d6851",
              "on-secondary-fixed-variant": "#2d4b58",
              "error-container": "#ffdad6",
              "secondary-fixed": "#c8e7f8",
              "on-surface": "#191c1c",
              "inverse-on-surface": "#eff1f0",
              "surface-container-lowest": "#ffffff",
              "on-primary-fixed": "#02201a",
              "primary-fixed": "#c9e9df",
              "on-tertiary-fixed": "#07200f",
              "on-secondary-container": "#496775",
              "on-surface-variant": "#414846",
              "on-tertiary-fixed-variant": "#334d38",
              primary: "#324f47",
              "surface-variant": "#e1e3e2",
              "surface-container-low": "#f2f4f3",
              "on-error": "#ffffff",
              "outline-variant": "#c1c8c4",
              "on-tertiary-container": "#c7e5c9",
              "on-secondary-fixed": "#001f2a",
              "tertiary-fixed-dim": "#b0ceb2",
              "surface-container": "#eceeed",
              "on-secondary": "#ffffff",
              secondary: "#456271",
              "on-tertiary": "#ffffff",
              "on-error-container": "#93000a",
              "tertiary-fixed": "#cceace",
              "secondary-fixed-dim": "#accbdc",
              "on-primary-fixed-variant": "#304c45",
              "on-background": "#191c1c",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              "margin-mobile": "16px",
              "target-min": "48px",
              gutter: "16px",
              unit: "8px",
              "margin-desktop": "24px",
            },
            fontFamily: {
              "title-lg": ["Manrope", "sans-serif"],
              "label-lg": ["Manrope", "sans-serif"],
              "body-md": ["Manrope", "sans-serif"],
              "label-md": ["Manrope", "sans-serif"],
              "body-lg": ["Manrope", "sans-serif"],
              "display-lg": ["Manrope", "sans-serif"],
              "headline-lg": ["Manrope", "sans-serif"],
            },
            fontSize: {
              "title-lg": ["22px", { lineHeight: "28px", letterSpacing: "0px", fontWeight: "500" }],
              "label-lg": ["14px", { lineHeight: "20px", letterSpacing: "0.1px", fontWeight: "500" }],
              "body-md": ["14px", { lineHeight: "20px", letterSpacing: "0.25px", fontWeight: "400" }],
              "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.5px", fontWeight: "500" }],
              "body-lg": ["16px", { lineHeight: "24px", letterSpacing: "0.5px", fontWeight: "400" }],
              "display-lg": ["57px", { lineHeight: "64px", letterSpacing: "-0.25px", fontWeight: "400" }],
              "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "0px", fontWeight: "600" }],
            },
          },
        },
      };
    </script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://unpkg.com/htmx.org@1.9.12"
      integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2"
      crossorigin="anonymous"
      defer
    ></script>
    <script
      src="https://unpkg.com/monaco-editor@0.52.2/min/vs/loader.js"
      integrity="sha384-pHG02SG8pId94Np3AbPmBEJ1yPqaH0IkJGLSNGXYmuGhkazT8Lr/57WYpbkGjJtu"
      crossorigin="anonymous"
      defer
    ></script>
    {% if let Some(csrf) = layout.csrf %}
    <meta name="csrf-token" content="{{ csrf.token }}" />
    {% endif %}
    <style>
      body {
        font-family: "Manrope", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
        line-height: 1;
      }

      .material-symbols-outlined.fill {
        font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24;
      }

      .code-font {
        font-family: "Fira Code", monospace;
      }

      .preview-scroll::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      .preview-scroll::-webkit-scrollbar-track {
        background: transparent;
      }

      .preview-scroll::-webkit-scrollbar-thumb {
        background-color: #c1c8c4;
        border-radius: 9999px;
      }
    </style>
    {% block head %}{% endblock %}
  </head>
  <body class="bg-background text-on-background font-body-md antialiased">
    {% block content %}{% endblock %}

    <script>
      "use strict";

      document.body.addEventListener("htmx:configRequest", (event) => {
        const tokenElement = document.querySelector('meta[name="csrf-token"]');
        if (!tokenElement) {
          return;
        }

        const token = tokenElement.getAttribute("content");
        if (!token) {
          return;
        }

        event.detail.headers["X-CSRF-Token"] = token;
      });

      document.addEventListener("click", (event) => {
        const trigger = event.target.closest("[data-copy]");
        if (!trigger) {
          return;
        }

        const explicitValue = trigger.getAttribute("data-copy-text");
        const targetSelector = trigger.getAttribute("data-copy-target");
        let copyValue = explicitValue;

        if (!copyValue && targetSelector) {
          const target = document.querySelector(targetSelector);
          if (target) {
            if (
              target instanceof HTMLInputElement ||
              target instanceof HTMLTextAreaElement
            ) {
              copyValue = target.value;
            } else {
              copyValue = target.textContent;
            }
          }
        }

        if (!copyValue) {
          return;
        }

        navigator.clipboard
          .writeText(copyValue.trim())
          .then(() => {
            trigger.dataset.copyState = "copied";
            setTimeout(() => {
              if (trigger.dataset.copyState === "copied") {
                delete trigger.dataset.copyState;
              }
            }, 2000);
          })
          .catch((error) => {
            console.error("Failed to copy to clipboard", error);
          });
      });
    </script>
    {% block body_scripts %}{% endblock %}
  </body>
</html>
