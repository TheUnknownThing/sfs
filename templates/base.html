<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      {% block title %}{{ layout.title }} - {{ layout.brand_name }}{% endblock %}
    </title>
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        const themeStorageKey = "sfs-theme";
        const validThemes = new Set(["light", "dark", "system"]);
        const root = document.documentElement;
        const colorScheme = document.querySelector('meta[name="color-scheme"]');
        const systemTheme = window.matchMedia("(prefers-color-scheme: dark)");

        const readTheme = () => {
          try {
            const storedTheme = localStorage.getItem(themeStorageKey);
            return validThemes.has(storedTheme) ? storedTheme : "system";
          } catch (_) {
            return "system";
          }
        };

        const resolvedTheme = (theme) => {
          if (theme === "system") {
            return systemTheme.matches ? "dark" : "light";
          }
          return theme;
        };

        const applyTheme = (theme = readTheme()) => {
          const effectiveTheme = resolvedTheme(theme);
          root.classList.toggle("dark", effectiveTheme === "dark");
          root.classList.toggle("light", effectiveTheme === "light");
          root.dataset.theme = theme;
          root.dataset.effectiveTheme = effectiveTheme;
          if (colorScheme) {
            colorScheme.setAttribute(
              "content",
              effectiveTheme === "dark" ? "dark light" : "light dark",
            );
          }
          return { theme, effectiveTheme };
        };

        const syncThemeToggles = () => {
          const { effectiveTheme } = applyTheme(readTheme());
          const nextTheme = effectiveTheme === "dark" ? "light" : "dark";
          const label = `Switch to ${nextTheme} theme`;
          document.querySelectorAll("[data-theme-toggle]").forEach((toggle) => {
            toggle.setAttribute("aria-label", label);
            toggle.setAttribute("title", label);
            toggle.setAttribute("aria-pressed", String(effectiveTheme === "dark"));
            toggle.querySelectorAll("[data-theme-icon]").forEach((icon) => {
              icon.textContent = effectiveTheme === "dark" ? "light_mode" : "dark_mode";
            });
            toggle.querySelectorAll("[data-theme-label]").forEach((text) => {
              text.textContent = effectiveTheme === "dark" ? "Light theme" : "Dark theme";
            });
          });
        };

        const saveTheme = (theme) => {
          try {
            localStorage.setItem(themeStorageKey, theme);
          } catch (_) {
          }
          applyTheme(theme);
          syncThemeToggles();
        };

        const toggleTheme = () => {
          const { effectiveTheme } = applyTheme(readTheme());
          saveTheme(effectiveTheme === "dark" ? "light" : "dark");
        };

        window.SfsTheme = {
          apply: applyTheme,
          read: readTheme,
          save: saveTheme,
          syncToggles: syncThemeToggles,
          toggle: toggleTheme,
        };

        const handleSystemThemeChange = () => {
          if (readTheme() === "system") {
            applyTheme("system");
            syncThemeToggles();
          }
        };

        applyTheme();
        if (typeof systemTheme.addEventListener === "function") {
          systemTheme.addEventListener("change", handleSystemThemeChange);
        } else if (typeof systemTheme.addListener === "function") {
          systemTheme.addListener(handleSystemThemeChange);
        }

        try {
          if (localStorage.getItem("sfs-sidebar-collapsed") === "true") {
            document.documentElement.dataset.sidebarCollapsed = "true";
          }
        } catch (_) {
        }
      })();
    </script>
    <link href="/static/css/app.css" rel="stylesheet" />
    <script src="/static/js/htmx.min.js" defer></script>
    {% if let Some(csrf) = layout.csrf %}
    <meta name="csrf-token" content="{{ csrf.token }}" />
    {% endif %}
    {% block head %}{% endblock %}
  </head>
  <body class="bg-background text-on-background font-body-md antialiased">
    {% block content %}{% endblock %}

    <script>
      "use strict";

      const syncSidebarToggles = () => {
        const collapsed =
          document.documentElement.dataset.sidebarCollapsed === "true";
        document.querySelectorAll("[data-sidebar-toggle]").forEach((toggle) => {
          const icon = toggle.querySelector(".material-symbols-outlined");
          if (icon) {
            icon.textContent = collapsed ? "menu" : "menu_open";
          }
          toggle.setAttribute("aria-expanded", String(!collapsed));
          toggle.setAttribute(
            "aria-label",
            collapsed ? "Expand sidebar" : "Collapse sidebar",
          );
        });
      };

      const syncThemeToggles = () => {
        window.SfsTheme?.syncToggles();
      };

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", () => {
          syncSidebarToggles();
          syncThemeToggles();
        });
      } else {
        syncSidebarToggles();
        syncThemeToggles();
      }

      document.body.addEventListener("htmx:configRequest", (event) => {
        const tokenElement = document.querySelector('meta[name="csrf-token"]');
        if (!tokenElement) {
          return;
        }

        const token = tokenElement.getAttribute("content");
        if (!token) {
          return;
        }

        event.detail.headers["X-CSRF-Token"] = token;
      });

      document.addEventListener("click", (event) => {
        const themeToggle = event.target.closest("[data-theme-toggle]");
        if (themeToggle) {
          window.SfsTheme?.toggle();
          return;
        }

        const sidebarToggle = event.target.closest("[data-sidebar-toggle]");
        if (sidebarToggle) {
          const root = document.documentElement;
          const nextCollapsed = root.dataset.sidebarCollapsed !== "true";
          root.dataset.sidebarCollapsed = nextCollapsed ? "true" : "false";
          syncSidebarToggles();
          try {
            localStorage.setItem("sfs-sidebar-collapsed", String(nextCollapsed));
          } catch (_) {
          }
          return;
        }

        const trigger = event.target.closest("[data-copy]");
        if (!trigger) {
          return;
        }

        const explicitValue = trigger.getAttribute("data-copy-text");
        const targetSelector = trigger.getAttribute("data-copy-target");
        let copyValue = explicitValue;

        if (!copyValue && targetSelector) {
          const target = document.querySelector(targetSelector);
          if (target) {
            if (
              target instanceof HTMLInputElement ||
              target instanceof HTMLTextAreaElement
            ) {
              copyValue = target.value;
            } else {
              copyValue = target.textContent;
            }
          }
        }

        if (!copyValue) {
          return;
        }

        navigator.clipboard
          .writeText(copyValue.trim())
          .then(() => {
            trigger.dataset.copyState = "copied";
            setTimeout(() => {
              if (trigger.dataset.copyState === "copied") {
                delete trigger.dataset.copyState;
              }
            }, 2000);
          })
          .catch((error) => {
            console.error("Failed to copy to clipboard", error);
          });
      });
    </script>
    {% block body_scripts %}{% endblock %}
  </body>
</html>
